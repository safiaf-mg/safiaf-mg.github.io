# Publie le site sur GitHub Pages (gratuit, sans carte bancaire) à chaque
# modification de la branche main. Voir docs/MISE-EN-LIGNE.md.
name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Toutes les heures : si le nom ou le logo (Paramètres › Apparence) a changé,
  # le site est republié pour mettre à jour l'icône de l'application installée.
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    outputs:
      publier: ${{ steps.marque.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - name: Comparer le nom et le logo avec le site en ligne
        id: marque
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" != "schedule" ]; then echo "publier=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          voulu=$(python3 .github/scripts/marque.py empreinte) || { echo "Nom et logo non lus : rien à faire."; echo "publier=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # Dépôt <compte>.github.io : site à la racine ; sinon dans /<dépôt>/.
          hote="${GITHUB_REPOSITORY_OWNER,,}.github.io"; depot="${GITHUB_REPOSITORY#*/}"
          if [ "${depot,,}" = "$hote" ]; then site="https://$hote/marque.txt"; else site="https://$hote/$depot/marque.txt"; fi
          en_ligne=$(curl -sS --fail "$site?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
          echo "Site : ${en_ligne:-aucune}, réglages : $voulu"
          if [ "$voulu" = "$en_ligne" ]; then echo "publier=false" >> "$GITHUB_OUTPUT"; else echo "publier=true" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: verifier
    runs-on: ubuntu-latest
    if: ${{ needs.verifier.outputs.publier == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Lire l'adresse GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Configurer l'adresse Supabase et le sous-dossier du site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          www=src/GestionUtilisateurs.Online.Web/wwwroot
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{Supabase: {Url: $url, AnonKey: $key}}' > "$www/appsettings.json"
          # Le site est servi depuis https://<compte>.github.io/ (ou /<dépôt>/) :
          # le chemin de base est fixé avant la publication pour que les
          # empreintes du mode hors ligne restent valides.
          base="${BASE_PATH%/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" "$www/index.html"
          sed -i "s|const base = \"/\";|const base = \"$base\";|" "$www/service-worker.published.js"
          grep -q "<base href=\"$base\" />" "$www/index.html"
          grep -q "const base = \"$base\";" "$www/service-worker.published.js"
      - name: Nom et logo de l'application installée (Paramètres › Apparence)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          python3 .github/scripts/marque.py appliquer src/GestionUtilisateurs.Online.Web/wwwroot
      - name: Publier
        run: dotnet publish src/GestionUtilisateurs.Online.Web -c Release -o publish
      - name: Préparer pour GitHub Pages
        run: |
          cd publish/wwwroot
          cp index.html 404.html
          touch .nojekyll
          rm -f staticwebapp.config.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
      - name: Envoyer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
