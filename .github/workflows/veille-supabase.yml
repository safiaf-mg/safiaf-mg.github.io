# Chaque jour :
#  1. appelle Supabase, ce qui évite la mise en pause du projet gratuit
#     après 7 jours sans activité ;
#  2. mesure l'espace utilisé (base + fichiers) et crée une alerte pour les
#     administrateurs si un seuil est franchi ;
#  3. ouvre (ou met à jour) un ticket GitHub « Alerte capacité Supabase »
#     pour prévenir aussi par e-mail GitHub ;
#  4. ouvre un ticket « Comptes en attente de validation » tant que des
#     inscriptions attendent un administrateur, et le ferme ensuite ; de même
#     pour les demandes « mot de passe oublié » (script SQL 0003) ;
#  5. modifie un petit fichier du dépôt si rien n'a changé depuis 50 jours :
#     GitHub suspend les tâches programmées d'un dépôt public après 60 jours
#     sans activité, ce qui arrêterait la veille et les sauvegardes.
name: Veille Supabase

# Et le 1er janvier, avril, juillet et octobre : ouvre un ticket
# « Vérification trimestrielle » avec la liste des contrôles à faire à la main.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  veille:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' && github.event.schedule != '0 7 1 1,4,7,10 *' }}
    steps:
      - name: Mesurer la capacité (et garder le projet actif)
        id: mesure
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/record_capacity_snapshot" \
                 -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                 -H "Content-Type: application/json" -d '{"p_source":"github"}' -o mesure.json; then
              break
            fi
            echo "Nouvel essai dans 30 s…"; sleep 30
          done
          cat mesure.json; echo
          echo "level=$(jq -r .level mesure.json)" >> "$GITHUB_OUTPUT"
          echo "db=$(jq -r .db_pct mesure.json)" >> "$GITHUB_OUTPUT"
          echo "files=$(jq -r .storage_pct mesure.json)" >> "$GITHUB_OUTPUT"
          echo "pending=$(jq -r .members_pending mesure.json)" >> "$GITHUB_OUTPUT"

      - name: Prévenir par ticket GitHub
        if: ${{ steps.mesure.outputs.level != 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEVEL: ${{ steps.mesure.outputs.level }}
          DB: ${{ steps.mesure.outputs.db }}
          FILES: ${{ steps.mesure.outputs.files }}
        run: |
          set -euo pipefail
          title="Alerte capacité Supabase"
          body="Niveau : **${LEVEL}** ($(date -u +%d/%m/%Y))

          - Base de données : ${DB} % de la limite gratuite (500 Mo)
          - Fichiers : ${FILES} % de la limite gratuite (1 Go)

          Ouvrez l'application > menu > **Capacité du serveur** pour voir le détail et libérer de l'espace."
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Prévenir des comptes en attente de validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PENDING: ${{ steps.mesure.outputs.pending }}
        run: |
          set -euo pipefail
          case "$PENDING" in ''|*[!0-9]*) PENDING=0 ;; esac
          read -r number title < <(gh issue list --state open --search 'in:title "en attente de validation"' \
            --json number,title -q '.[0] // empty | "\(.number) \(.title)"' || true) || true
          if [ "$PENDING" -eq 0 ]; then
            if [ -n "${number:-}" ]; then
              gh issue close "$number" --comment "Plus aucun compte en attente. Merci !"
            fi
            exit 0
          fi
          new_title="$PENDING compte(s) en attente de validation"
          body="$PENDING personne(s) se sont inscrites et attendent qu'un administrateur valide leur compte.

          Ouvrez l'application > menu > **Comptes en ligne** pour accepter ou refuser chaque demande. Ce ticket se fermera tout seul ensuite."
          if [ -z "${number:-}" ]; then
            gh issue create --title "$new_title" --body "$body"
          elif [ "$title" != "$new_title" ]; then
            gh issue edit "$number" --title "$new_title"
            gh issue comment "$number" --body "$body"
          fi

      - name: Prévenir des demandes de mot de passe oublié
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          # Seul le nombre est publié (le dépôt est public) : ni nom ni e-mail.
          if ! curl -sS --fail-with-body "$SUPABASE_URL/rest/v1/profiles?select=id&statut=eq.actif&mdp_demande_at=not.is.null" \
               -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -o demandes.json; then
            echo "Script SQL 0003 pas encore installé : étape ignorée."; exit 0
          fi
          COUNT=$(jq 'length' demandes.json 2>/dev/null || echo 0)
          read -r number title < <(gh issue list --state open --search 'in:title "mot de passe oublié"' \
            --json number,title -q '.[0] // empty | "\(.number) \(.title)"' || true) || true
          if [ "$COUNT" -eq 0 ]; then
            if [ -n "${number:-}" ]; then
              gh issue close "$number" --comment "Plus aucune demande en attente. Merci !"
            fi
            exit 0
          fi
          new_title="$COUNT demande(s) de mot de passe oublié"
          body="$COUNT membre(s) ont demandé un nouveau mot de passe depuis l'écran de connexion.

          Ouvrez l'application > menu > **Comptes en ligne** > « Mots de passe oubliés » : donnez un mot de passe provisoire et transmettez-le au membre (téléphone, SMS ou de vive voix). Ce ticket se fermera tout seul ensuite."
          if [ -z "${number:-}" ]; then
            gh issue create --title "$new_title" --body "$body"
          elif [ "$title" != "$new_title" ]; then
            gh issue edit "$number" --title "$new_title"
            gh issue comment "$number" --body "$body"
          fi

  trimestre:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 7 1 1,4,7,10 *' }}
    steps:
      - name: Ouvrir le ticket de vérification trimestrielle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh issue create --title "Vérification trimestrielle ($(date -u +%m/%Y))" --body "Quelques minutes, quatre fois par an. Cochez chaque case puis fermez ce ticket.

          - [ ] **Ouvrir une sauvegarde** : Actions > Sauvegarde > dernière exécution verte > télécharger \`sauvegarde-base\` et l'ouvrir avec 7-Zip et le mot de passe. Si le mot de passe est perdu, changez le secret \`SAUVEGARDE_MOT_DE_PASSE\` tout de suite.
          - [ ] **Regarder l'onglet Actions** : Veille Supabase et Sauvegarde doivent être vertes (pas de croix rouge ni de message « disabled »).
          - [ ] **Ouvrir le site** et se connecter en administrateur : menu > Capacité du serveur doit rester sous 70 %.
          - [ ] **Vérifier les administrateurs** : dans Comptes en ligne, au moins deux personnes de confiance ont le rôle administrateur, et les anciens membres sont désactivés."

  activite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Garder les tâches programmées actives
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Dernière modification du dépôt il y a $age jour(s)."
          if [ "$age" -lt 50 ]; then exit 0; fi
          date -u +%Y-%m-%d > .github/derniere-activite.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/derniere-activite.txt
          git commit -m "Garder les tâches automatiques actives [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
